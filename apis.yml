aid: cove
name: Cove
description: 'Cove is a visual workspace for thinking with AI — an AI collaborator that works alongside
  you on projects big and small in a spatial, canvas-style interface rather than a linear chat. The product
  pairs an on-screen agent that can search the web, write and run code, and cite sources with a flexible
  visual surface for organizing ideas, and it ships an accompanying Chrome browser extension. Cove is a
  consumer/prosumer application backed by the venture firm Homebrew; as of this profile it does not publish
  a public developer API, OpenAPI definition, or developer documentation. This entry tracks Cove in the
  API Evangelist network, with domain-security posture captured by the enrichment pipeline.'
